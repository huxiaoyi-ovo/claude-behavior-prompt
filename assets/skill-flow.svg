<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Skill flow diagram">
  <rect width="1200" height="300" fill="#f7f5ef"/>
  <text x="70" y="55" fill="#1f2937" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">How it works</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">
    <rect x="70" y="110" width="200" height="92" rx="18" fill="#ffffff" stroke="#d1d5db"/>
    <text x="170" y="148" fill="#111827" font-weight="700">User prompt</text>
    <text x="170" y="176" fill="#6b7280">question, task, or draft</text>
    <rect x="350" y="110" width="220" height="92" rx="18" fill="#ffffff" stroke="#d1d5db"/>
    <text x="460" y="148" fill="#111827" font-weight="700">Base model</text>
    <text x="460" y="176" fill="#6b7280">GPT / Grok / Gemini / ...</text>
    <rect x="650" y="110" width="220" height="92" rx="18" fill="#ffffff" stroke="#d1d5db"/>
    <text x="760" y="148" fill="#111827" font-weight="700">Behavior skill</text>
    <text x="760" y="176" fill="#6b7280">rules, constraints, defaults</text>
    <rect x="950" y="110" width="180" height="92" rx="18" fill="#ffffff" stroke="#d1d5db"/>
    <text x="1040" y="148" fill="#111827" font-weight="700">Response</text>
    <text x="1040" y="176" fill="#6b7280">more Claude-like</text>
  </g>
  <g stroke="#6b7280" stroke-width="3" fill="none">
    <path d="M270 156 H336"/><path d="M570 156 H636"/><path d="M870 156 H936"/>
    <path d="M326 150 l10 6 l-10 6"/><path d="M626 150 l10 6 l-10 6"/><path d="M926 150 l10 6 l-10 6"/>
  </g>
  <text x="70" y="255" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="17">The base model stays the same. The skill changes interaction behavior: less sycophancy, better uncertainty handling, more honest tool use, and clearer self-correction.</text>
</svg>