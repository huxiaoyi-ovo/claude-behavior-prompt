<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Claude Behavior Skill social card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1070" cy="100" r="170" fill="#7c3aed" opacity="0.15" filter="url(#glow)"/>
  <circle cx="120" cy="570" r="180" fill="#f97316" opacity="0.11" filter="url(#glow)"/>

  <rect x="78" y="72" width="152" height="42" rx="21" fill="#ffffff" opacity="0.08"/>
