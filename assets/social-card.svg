  <text x="78" y="495" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="24">GPT · Grok · Gemini · DeepSeek · Qwen · GLM · Kimi · Local LLMs</text>
  <text x="78" y="558" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="22">github.com/huxiaoyi-ovo/claude-behavior-prompt</text>

