  <text x="78" y="220" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800">Claude Behavior Skill</text>
  <rect x="78" y="250" width="625" height="6" rx="3" fill="url(#accent)"/>

  <text x="78" y="318" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="30">Make non-Claude models behave more like Claude.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
