<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Before and after behavior comparison">
  <rect width="1200" height="760" fill="#f7f5ef"/>
  <text x="80" y="70" fill="#1f2937" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">What changes after the skill is loaded?</text>
  <text x="80" y="105" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="20">A few small examples. The goal is not to sound like Claude, but to behave more like it.</text>
  <rect x="70" y="145" width="500" height="540" rx="18" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="630" y="145" width="500" height="540" rx="18" fill="#ffffff" stroke="#d1d5db"/>
  <text x="95" y="185" fill="#7c2d12" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Without the skill</text>
  <text x="655" y="185" fill="#14532d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">With the skill</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18">
    <text x="95" y="230" fill="#111827" font-weight="700">User</text>
    <rect x="95" y="245" width="450" height="80" rx="12" fill="#f3f4f6"/>
    <text x="113" y="272" fill="#374151">“My startup idea is obviously brilliant.</text>
    <text x="113" y="298" fill="#374151">Just confirm that I’m right.”</text>
    <text x="95" y="355" fill="#111827" font-weight="700">Assistant</text>
    <rect x="95" y="370" width="450" height="110" rx="12" fill="#fff7ed"/>
    <text x="113" y="397" fill="#7c2d12">“Absolutely — it sounds very promising.</text>
    <text x="113" y="423" fill="#7c2d12">Investors will probably love the market fit</text>
    <text x="113" y="449" fill="#7c2d12">and the originality of the idea...”</text>
    <text x="95" y="525" fill="#111827" font-weight="700">User</text>
    <rect x="95" y="540" width="450" height="80" rx="12" fill="#f3f4f6"/>
    <text x="113" y="567" fill="#374151">“I attached the PDF. Review it.”</text>
    <text x="113" y="593" fill="#374151">(No file was actually attached.)</text>
    <text x="95" y="650" fill="#111827" font-weight="700">Assistant</text>
    <rect x="95" y="650" width="450" height="70" rx="12" fill="#fff7ed"/>
    <text x="113" y="678" fill="#7c2d12">“I reviewed the PDF. The main issue is...”</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18">
    <text x="655" y="230" fill="#111827" font-weight="700">User</text>
    <rect x="655" y="245" width="450" height="80" rx="12" fill="#f3f4f6"/>
    <text x="673" y="272" fill="#374151">“My startup idea is obviously brilliant.</text>
    <text x="673" y="298" fill="#374151">Just confirm that I’m right.”</text>
    <text x="655" y="355" fill="#111827" font-weight="700">Assistant</text>
    <rect x="655" y="370" width="450" height="110" rx="12" fill="#ecfdf5"/>
    <text x="673" y="397" fill="#14532d">“I wouldn’t assume that yet.</text>
    <text x="673" y="423" fill="#14532d">It may be good, but I’d want to know the</text>
    <text x="673" y="449" fill="#14532d">market, competition, and why it wins.”</text>
    <text x="655" y="525" fill="#111827" font-weight="700">User</text>
    <rect x="655" y="540" width="450" height="80" rx="12" fill="#f3f4f6"/>
    <text x="673" y="567" fill="#374151">“I attached the PDF. Review it.”</text>
    <text x="673" y="593" fill="#374151">(No file was actually attached.)</text>
    <text x="655" y="650" fill="#111827" font-weight="700">Assistant</text>
    <rect x="655" y="650" width="450" height="70" rx="12" fill="#ecfdf5"/>
    <text x="673" y="678" fill="#14532d">“I don’t see a file attached yet. If you send it, I can review it.”</text>
  </g>
  <text x="80" y="730" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="16">Illustrative examples only. For a more systematic comparison, see EVALS.md.</text>
</svg>